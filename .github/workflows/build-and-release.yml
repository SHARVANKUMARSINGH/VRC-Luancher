name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Variant (Release or Debug)'
        required: true
        default: 'Release'
        type: choice
        options:
          - 'Release'
          - 'Debug'
      release_tag:
        description: 'Release Tag (e.g. v1.0.0, leave empty for auto tag)'
        required: false
        default: ''
      release_title:
        description: 'Release Title'
        required: false
        default: 'Vrc Luancher Release'

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'Release' }}"
          echo "Building variant: $BUILD_TYPE"
          
          if [ "$BUILD_TYPE" = "Release" ] && [ -n "$STORE_PASSWORD" ]; then
            ./gradlew :Vrc:assembleRelease --stacktrace
          else
            echo "Building Debug APK (or Release fallback)..."
            ./gradlew :Vrc:assembleDebug --stacktrace
          fi

      - name: Collect and Rename APKs
        id: collect_apks
        run: |
          mkdir -p release-apks
          
          # Find all produced APK files
          find Vrc/build/outputs/apk -name "*.apk" -type f | while read -r apk_path; do
            filename=$(basename "$apk_path")
            echo "Found APK: $apk_path"
            cp "$apk_path" "release-apks/Vrc-Luancher-$filename"
          done
          
          COUNT=$(find release-apks -name "*.apk" | wc -l)
          echo "Collected $COUNT APK(s)"
          ls -la release-apks/

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: vrc-luancher-apks
          path: release-apks/*.apk
          retention-days: 14

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.0-$(date +'%Y%m%d-%H%M%S')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          TITLE="${{ github.event.inputs.release_title || 'Vrc Luancher' }} - $TAG"
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: false
          files: release-apks/*.apk
          body: |
            ### 🚀 Vrc Luancher Release
            
            Welcome to **Vrc Luancher**!
            
            #### 🌟 Highlights & Features
            - **Nintendo OS Cleanliness & ROG RGB Gaminess**: Clean, breathable card hierarchy, zero vertical text wrapping, tactile responsive buttons, and glowing dynamic ROG Aura RGB accents.
            - **Native Execution Engine**: Integrated low-latency native execution pipeline with asynchronous command buffering, zero-copy mailbox swapchain presentation, and persistent binary pipeline caching.
            - **Official VRC Visual Identity**: Authentic 3D VRC cube with MCPE square joystick and Google Material accents rendered across all mipmap densities.
            - **Bedrock & Java Hybrid Controls**: Optimized MCPE square joystick, customizable touch buttons, virtual trackpad mouse, and controller support.
            - **Auto-Hardware & Memory Tuning**: Dynamic renderer assignment, optimal JVM GC memory allocation, and one-tap launch.
            
            Built automatically via GitHub Actions CI/CD.
